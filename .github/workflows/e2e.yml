name: E2E smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-smoke
  cancel-in-progress: true

jobs:
  task-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Confirm E2E configuration
        run: |
          test -n "$E2E_BASE_URL" || { echo "Missing E2E_BASE_URL secret"; exit 1; }
          test -n "$E2E_USER_EMAIL" || { echo "Missing E2E_USER_EMAIL secret"; exit 1; }
          test -n "$E2E_USER_PASSWORD" || { echo "Missing E2E_USER_PASSWORD secret"; exit 1; }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
